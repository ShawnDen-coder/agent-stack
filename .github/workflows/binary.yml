name: Standalone binary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:binary
      - name: Use Node 24 for artifact verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - run: node scripts/verify-binary.mjs
      - if: runner.os == 'macOS'
        run: npm install --global npm@11.12.1
      - name: Verify standalone coding on native macOS
        if: runner.os == 'macOS'
        run: node scripts/smoke-coding-macos.mjs --cli "$(pwd)/binary/agent-stack" --target "darwin-$(node -p process.arch)" --binary
