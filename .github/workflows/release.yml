name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'ShawnDen-coder/agent-stack'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Check exact tag, reviewed history and version
        id: gate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master' "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_SHA"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/master
          node scripts/check-release-ref.mjs
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

  npm-artifact:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: node scripts/package-npm.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: |
            release/package.tgz
            release/package.tgz.sha256
          if-no-files-found: error

  binary-artifact:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:binary
      - name: Use Node 24 for artifact verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - if: runner.os == 'macOS'
        run: npm install --global npm@11.12.1
      - name: Verify standalone coding on native macOS
        if: runner.os == 'macOS'
        run: node scripts/smoke-coding-macos.mjs --cli "$(pwd)/binary/agent-stack" --target "${{ matrix.target }}" --binary
      - run: node scripts/package-binary.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            release/agent-stack-${{ matrix.target }}.tar.gz
            release/agent-stack-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish-npm:
    needs: [gate, npm-artifact, binary-artifact]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: npm-package
          path: release
      - name: Recheck release identity and verified tarball
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master' "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_SHA"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/master
          node scripts/check-release-ref.mjs
          node scripts/check-artifact.mjs verify release/package.tgz
          node -e 'const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(process.argv[1]); if (!m) process.exit(1); const [a,b,c] = m.slice(1).map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1)' "$(npm --version)"
      - run: node scripts/publish-npm.mjs release/package.tgz

  github-release:
    needs: [gate, npm-artifact, binary-artifact, publish-npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: Recheck identity, checksums and publish release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master' "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_SHA"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/master
          node scripts/check-release-ref.mjs
          mkdir release
          for target in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
            file="artifacts/binary-$target/agent-stack-$target.tar.gz"
            node scripts/check-artifact.mjs verify "$file"
            cp "$file" "$file.sha256" release/
          done
          node scripts/check-artifact.mjs verify artifacts/npm-package/package.tgz
          cp artifacts/npm-package/package.tgz artifacts/npm-package/package.tgz.sha256 release/
          cat release/*.sha256 > release/SHA256SUMS
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_flags[@]}" release/package.tgz release/agent-stack-*.tar.gz release/SHA256SUMS
